<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知识库问答系统</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: rgba(255, 255, 255, 0.88);
            --panel-strong: #ffffff;
            --text: #172033;
            --muted: #68758a;
            --line: rgba(32, 52, 84, 0.12);
            --primary: #2667ff;
            --primary-dark: #174de0;
            --green: #16a074;
            --amber: #d9822b;
            --shadow: 0 24px 70px rgba(35, 55, 92, 0.16);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(38, 103, 255, 0.16), transparent 30%),
                radial-gradient(circle at 88% 8%, rgba(22, 160, 116, 0.14), transparent 28%),
                linear-gradient(135deg, #f8fbff 0%, var(--bg) 52%, #eef3f8 100%);
        }

        .shell {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 38px 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .logo {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary), #17a98e);
            box-shadow: 0 14px 34px rgba(38, 103, 255, 0.28);
        }

        .logo svg,
        .button-icon svg,
        .meta-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(24px, 3vw, 36px);
            line-height: 1.12;
            letter-spacing: 0;
        }

        .brand p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.74);
            font-size: 13px;
            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 5px rgba(22, 160, 116, 0.12);
        }

        .workspace {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 22px;
            align-items: stretch;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .sidebar {
            padding: 20px;
        }

        .section-title {
            margin: 0 0 6px;
            font-size: 18px;
            line-height: 1.3;
        }

        .section-subtitle {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7;
        }

        .upload-box {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 172px;
            padding: 22px;
            border: 1px dashed rgba(38, 103, 255, 0.42);
            border-radius: var(--radius);
            background: linear-gradient(180deg, rgba(38, 103, 255, 0.06), rgba(255, 255, 255, 0.6));
            text-align: center;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: linear-gradient(180deg, rgba(38, 103, 255, 0.1), rgba(255, 255, 255, 0.74));
            transform: translateY(-1px);
        }

        .upload-box input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-mark {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            margin: 0 auto 14px;
            border-radius: var(--radius);
            color: var(--primary);
            background: rgba(38, 103, 255, 0.1);
        }

        .upload-mark svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .file-name {
            min-height: 22px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .button {
            width: 100%;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 14px;
            border: 0;
            border-radius: var(--radius);
            color: #ffffff;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 12px 28px rgba(38, 103, 255, 0.24);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 34px rgba(38, 103, 255, 0.3);
        }

        .button:disabled {
            cursor: not-allowed;
            opacity: 0.62;
            transform: none;
            box-shadow: none;
        }

        .meta-list {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        .meta-item {
            display: flex;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.62);
        }

        .meta-icon {
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            color: var(--green);
            background: rgba(22, 160, 116, 0.1);
        }

        .meta-item strong {
            display: block;
            margin-bottom: 3px;
            font-size: 13px;
        }

        .meta-item span {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .chat-panel {
            min-height: 640px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 22px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.64);
        }

        .chat-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .chat-header p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 6px 10px;
            border: 1px solid rgba(22, 160, 116, 0.24);
            border-radius: 999px;
            color: #0e765c;
            background: rgba(22, 160, 116, 0.08);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .conversation {
            padding: 22px;
            overflow: auto;
            background:
                linear-gradient(rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.62)),
                linear-gradient(90deg, rgba(23, 32, 51, 0.045) 1px, transparent 1px),
                linear-gradient(rgba(23, 32, 51, 0.045) 1px, transparent 1px);
            background-size: auto, 28px 28px, 28px 28px;
        }

        .empty-state {
            height: 100%;
            min-height: 360px;
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
        }

        .empty-state-inner {
            width: min(420px, 100%);
        }

        .empty-state h3 {
            margin: 0 0 8px;
            color: var(--text);
            font-size: 24px;
        }

        .empty-state p {
            margin: 0;
            font-size: 14px;
            line-height: 1.8;
        }

        .answer-card {
            display: none;
            max-width: 860px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel-strong);
            box-shadow: 0 14px 36px rgba(35, 55, 92, 0.11);
        }

        .answer-card.is-visible {
            display: block;
        }

        .answer-card .label {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        #answer {
            margin: 0;
            color: #26334b;
            font-size: 15px;
            line-height: 1.85;
            white-space: pre-wrap;
        }

        .composer {
            padding: 18px 22px 22px;
            border-top: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.78);
        }

        .question-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 132px;
            gap: 12px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            outline: none;
            color: var(--text);
            background: #ffffff;
            font: inherit;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .input-wrap input:focus {
            border-color: rgba(38, 103, 255, 0.62);
            box-shadow: 0 0 0 4px rgba(38, 103, 255, 0.1);
        }

        .ask-button {
            min-height: 48px;
            margin: 0;
        }

        .message {
            min-height: 20px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 13px;
        }

        .message.success {
            color: var(--green);
        }

        .message.warning {
            color: var(--amber);
        }

        .message.error {
            color: #cf3f42;
        }

        @media (max-width: 860px) {
            .shell {
                width: min(100% - 24px, 680px);
                padding: 22px 0;
            }

            .topbar,
            .chat-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            .chat-panel {
                min-height: 560px;
            }
        }

        @media (max-width: 560px) {
            .brand {
                align-items: flex-start;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

            .sidebar,
            .conversation,
            .chat-header,
            .composer {
                padding-left: 16px;
                padding-right: 16px;
            }

            .question-row {
                grid-template-columns: 1fr;
            }

            .ask-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3v18"></path>
                        <path d="M5 7h10a4 4 0 0 1 0 8H5z"></path>
                        <path d="M15 15l4 4"></path>
                    </svg>
                </div>
                <div>
                    <h1>AI 知识库问答系统</h1>
                    <p>上传资料，构建专属知识库，然后用自然语言快速检索答案。</p>
                </div>
            </div>
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>本地 RAG 服务</span>
            </div>
        </header>

        <section class="workspace" aria-label="AI 知识库工作台">
            <aside class="panel sidebar">
                <h2 class="section-title">知识库文档</h2>
                <p class="section-subtitle">选择一个文件上传到向量库，系统会把文档内容作为问答依据。</p>

                <label class="upload-box" for="fileInput">
                    <input type="file" id="fileInput">
                    <span>
                        <span class="upload-mark" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 15V3"></path>
                                <path d="M7 8l5-5 5 5"></path>
                                <path d="M5 19h14"></path>
                            </svg>
                        </span>
                        <strong>点击选择文件</strong>
                        <span class="file-name" id="fileName">支持 PDF、TXT、Markdown、Word 等知识库资料</span>
                    </span>
                </label>

                <button class="button" id="uploadButton" onclick="uploadFile()">
                    <span class="button-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <path d="M17 8l-5-5-5 5"></path>
                            <path d="M12 3v12"></path>
                        </svg>
                    </span>
                    上传并索引
                </button>

                <div class="meta-list">
                    <div class="meta-item">
                        <span class="meta-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <path d="M14 2v6h6"></path>
                                <path d="M8 13h8"></path>
                                <path d="M8 17h6"></path>
                            </svg>
                        </span>
                        <span>
                            <strong>文档解析</strong>
                            <span>上传后自动提交到后端接口进行知识入库。</span>
                        </span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="M21 21l-4.3-4.3"></path>
                            </svg>
                        </span>
                        <span>
                            <strong>语义检索</strong>
                            <span>提问时从知识库召回相关片段并生成答案。</span>
                        </span>
                    </div>
                </div>

                <div class="message" id="uploadStatus"></div>
            </aside>

            <section class="panel chat-panel">
                <div class="chat-header">
                    <div>
                        <h2>知识库对话</h2>
                        <p>输入问题，系统会基于已上传资料进行回答。</p>
                    </div>
                    <span class="tag">RAG Assistant</span>
                </div>

                <div class="conversation" id="conversation">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-state-inner">
                            <h3>开始一次知识检索</h3>
                            <p>上传文档后，可以询问摘要、关键结论、流程步骤、术语解释或指定内容的位置。</p>
                        </div>
                    </div>
                    <article class="answer-card" id="answerCard">
                        <p class="label">Answer</p>
                        <p id="answer"></p>
                    </article>
                </div>

                <div class="composer">
                    <div class="question-row">
                        <div class="input-wrap">
                            <input type="text" id="question" placeholder="请输入你的问题，例如：这份文档的核心结论是什么？" onkeydown="handleQuestionKeydown(event)">
                        </div>
                        <button class="button ask-button" id="askButton" onclick="askQuestion()">
                            <span class="button-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M22 2L11 13"></path>
                                    <path d="M22 2l-7 20-4-9-9-4z"></path>
                                </svg>
                            </span>
                            提问
                        </button>
                    </div>
                    <div class="message" id="askStatus"></div>
                </div>
            </section>
        </section>
    </main>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const fileInput = document.getElementById("fileInput");
        const fileName = document.getElementById("fileName");
        const uploadStatus = document.getElementById("uploadStatus");
        const askStatus = document.getElementById("askStatus");
        const uploadButton = document.getElementById("uploadButton");
        const askButton = document.getElementById("askButton");
        const answer = document.getElementById("answer");
        const answerCard = document.getElementById("answerCard");
        const emptyState = document.getElementById("emptyState");
        const questionInput = document.getElementById("question");

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            fileName.textContent = file ? file.name : "支持 PDF、TXT、Markdown、Word 等知识库资料";
            uploadStatus.textContent = "";
            uploadStatus.className = "message";
        });

        function setLoading(button, isLoading, loadingText, defaultText) {
            button.disabled = isLoading;
            button.dataset.label = button.dataset.label || defaultText;
            button.lastChild.textContent = isLoading ? loadingText : button.dataset.label;
        }

        function setMessage(element, text, type) {
            element.textContent = text;
            element.className = `message ${type || ""}`.trim();
        }

        async function uploadFile() {
            const file = fileInput.files[0];

            if (!file) {
                setMessage(uploadStatus, "请先选择需要上传的知识库文件。", "warning");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);
            setLoading(uploadButton, true, "上传中", "上传并索引");
            setMessage(uploadStatus, "正在上传并建立索引，请稍候...", "");

            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`上传失败：${response.status}`);
                }

                setMessage(uploadStatus, "上传成功，知识库已更新。", "success");
            } catch (error) {
                setMessage(uploadStatus, error.message || "上传失败，请检查后端服务是否启动。", "error");
            } finally {
                setLoading(uploadButton, false, "上传中", "上传并索引");
            }
        }

        async function askQuestion() {
            const q = questionInput.value.trim();

            if (!q) {
                setMessage(askStatus, "请输入问题后再提问。", "warning");
                questionInput.focus();
                return;
            }

            setLoading(askButton, true, "思考中", "提问");
            setMessage(askStatus, "正在检索知识库并生成答案...", "");

            try {
                const response = await fetch(`${API_BASE}/chat?q=${encodeURIComponent(q)}`);

                if (!response.ok) {
                    throw new Error(`请求失败：${response.status}`);
                }

                const data = await response.json();

                if (data.error) {
                    emptyState.style.display = "grid";
                    answerCard.classList.remove("is-visible");
                    answer.innerText = "";
                    setMessage(askStatus, data.error, "warning");
                    return;
                }

                emptyState.style.display = "none";
                answerCard.classList.add("is-visible");
                answer.innerText = data.answer || "后端已返回结果，但没有 answer 字段。";
                setMessage(askStatus, "回答已生成。", "success");
            } catch (error) {
                setMessage(askStatus, error.message || "提问失败，请检查后端服务是否启动。", "error");
            } finally {
                setLoading(askButton, false, "思考中", "提问");
            }
        }

        function handleQuestionKeydown(event) {
            if (event.key === "Enter") {
                askQuestion();
            }
        }
    </script>
</body>
</html>
